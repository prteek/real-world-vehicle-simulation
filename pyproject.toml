[project]
name = "real-world-vehicle-simulation"
version = "0.1.0"
description = "Would an electric truck manage a real driving log? Battery and opportunistic charging simulation: app and dataset"
requires-python = ">=3.12"
# the shared package (vehicle_sim): drive cycle and the simulation
dependencies = [
    "huggingface-hub>=0.30",  # the data comes from the dataset
    "numpy>=2.0",
    "pandas>=2.2",
]

[dependency-groups]
# the Gradio Space (space/)
app = [
    "gradio>=6.30.0",
    "plotly>=5.24",
]
dev = ["pytest>=8"]

[tool.uv]
default-groups = ["app", "dev"]

[tool.pytest.ini_options]
pythonpath = ["."]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vehicle_sim"]
